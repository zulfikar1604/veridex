<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veridex | Verified. Rankes. Trusted.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .active-menu { background: #ef4444; color: white; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 font-sans" x-data="veridexApp()">

    <template x-if="role === 'Guest'">
        <div class="min-h-screen flex flex-col items-center justify-center bg-slate-900 p-6">
            <div class="mb-8 text-center">
                <h1 class="text-5xl font-black text-white tracking-tighter">VERIDEX</h1>
                <p class="text-red-500 tracking-[0.3em] font-bold">VERIFIED. RANKES. TRUSTED.</p>
            </div>
            <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
                <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">Portal Login Tunggal</h2>
                <div class="space-y-4">
                    <button @click="setRole('Gudang', 'inventory')" class="w-full p-4 border rounded-xl hover:bg-red-50 hover:border-red-500 transition flex items-center">
                        <i class="fa-solid fa-warehouse mr-4 text-red-500"></i> Login Tim Gudang
                    </button>
                    <button @click="setRole('Procurement', 'rop')" class="w-full p-4 border rounded-xl hover:bg-red-50 hover:border-red-500 transition flex items-center">
                        <i class="fa-solid fa-handshake mr-4 text-red-500"></i> Login Tim Procurement
                    </button>
                    <button @click="setRole('Finance', '3way')" class="w-full p-4 border rounded-xl hover:bg-red-50 hover:border-red-500 transition flex items-center">
                        <i class="fa-solid fa-file-invoice-dollar mr-4 text-red-500"></i> Login Tim Finance
                    </button>
                    <button @click="setRole('Vendor', 'bidding')" class="w-full p-4 border rounded-xl hover:bg-red-50 hover:border-red-500 transition flex items-center">
                        <i class="fa-solid fa-truck-moving mr-4 text-red-500"></i> Portal Vendor
                    </button>
                    <div class="relative py-4"><div class="absolute inset-0 flex items-center"><span class="w-full border-t"></span></div><div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-500">Atau</span></div></div>
                    <button @click="role = 'Public'" class="w-full p-3 text-red-600 font-bold border-2 border-red-600 rounded-xl hover:bg-red-600 hover:text-white transition">Registrasi Vendor Baru / Info</button>
                </div>
            </div>
        </div>
    </template>

    <template x-if="role !== 'Guest' && role !== 'Public'">
        <div class="flex h-screen overflow-hidden">
            <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-xl">
                <div class="p-6 border-b border-slate-800">
                    <h1 class="text-2xl font-black text-red-500">VERIDEX</h1>
                    <p class="text-[10px] text-slate-400">ROLE: <span x-text="role.toUpperCase()"></span></p>
                </div>
                
                <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                    <template x-if="role === 'Gudang'">
                        <div class="space-y-1">
                            <button @click="view = 'inbound'" :class="view === 'inbound' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-download mr-3"></i> Scan Barcode Inbound</button>
                            <button @click="view = 'outbound'" :class="view === 'outbound' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-upload mr-3"></i> Scan Barcode Outbound</button>
                            <button @click="view = 'inventory'" :class="view === 'inventory' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-table-list mr-3"></i> Monitoring Stok RT</button>
                            <button @click="view = 'rop-notif'" :class="view === 'rop-notif' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-triangle-exclamation mr-3 text-red-400"></i> Notifikasi ROP</button>
                        </div>
                    </template>

                    <template x-if="role === 'Procurement'">
                        <div class="space-y-1">
                            <button @click="view = 'rop'" :class="view === 'rop' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-bullseye mr-3"></i> Pusat Kendali ROP</button>
                            <button @click="view = 'scoring'" :class="view === 'scoring' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-calculator mr-3"></i> Auto-Scoring TBE/CBE</button>
                            <button @click="view = 'ranking'" :class="view === 'ranking' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-ranking-star mr-3"></i> Ranking & Multi-Vendor</button>
                            <button @click="view = 'chat'" :class="view === 'chat' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-comments mr-3"></i> Messaging System</button>
                            <button @click="view = 'approval'" :class="view === 'approval' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-user-check mr-3"></i> Approval Manager</button>
                        </div>
                    </template>

                    <template x-if="role === 'Finance'">
                        <div class="space-y-1">
                            <button @click="view = '3way'" :class="view === '3way' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-magnifying-glass-dollar mr-3"></i> Three-Way Matching</button>
                            <button @click="view = 'settlement'" :class="view === 'settlement' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-money-check-dollar mr-3"></i> Management Pembayaran</button>
                            <button @click="view = 'upload-proof'" :class="view === 'upload-proof' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-cloud-arrow-up mr-3"></i> Upload Bukti Bayar</button>
                        </div>
                    </template>

                    <template x-if="role === 'Vendor'">
                        <div class="space-y-1">
                            <button @click="view = 'bidding'" :class="view === 'bidding' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-gavel mr-3"></i> Bidding Area</button>
                            <button @click="view = 'po-manage'" :class="view === 'po-manage' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-file-contract mr-3"></i> Manajemen & Konfirmasi PO</button>
                            <button @click="view = 'delivery'" :class="view === 'delivery' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-truck-ramp-box mr-3"></i> Delivery Management</button>
                            <button @click="view = 'vchat'" :class="view === 'vchat' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-comment-dots mr-3"></i> Messaging Center</button>
                            <button @click="view = 'invoice'" :class="view === 'invoice' ? 'active-menu' : ''" class="w-full p-3 text-left flex items-center"><i class="fa-solid fa-receipt mr-3"></i> E-Invoicing</button>
                        </div>
                    </template>
                </nav>

                <div class="p-4 bg-slate-950">
                    <button @click="role = 'Guest'" class="w-full py-2 bg-gray-700 hover:bg-red-600 rounded-lg text-sm transition">Keluar</button>
                </div>
            </aside>

            <main class="flex-1 bg-gray-50 overflow-y-auto p-8">
                <div class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm border">
                    <h2 class="text-xl font-bold text-slate-800 uppercase tracking-widest" x-text="view.replace('-', ' ')"></h2>
                    <div class="flex items-center gap-4">
                        <span class="text-xs font-bold text-gray-400" x-text="new Date().toLocaleDateString('id-ID', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'})"></span>
                        <div class="w-8 h-8 rounded-full bg-red-500 flex items-center justify-center font-bold text-white shadow-lg" x-text="role[0]"></div>
                    </div>
                </div>

                <div class="mb-8 space-y-6" x-show="view === 'inventory' || view === 'rop'">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-3xl border-l-8 border-red-600 shadow-sm relative overflow-hidden group transition hover:shadow-md">
                            <div class="relative z-10">
                                <p class="text-xs font-black text-red-600 uppercase tracking-widest text-[10px]">Stok Kritis (< 7)</p>
                                <h4 class="text-4xl font-black text-slate-800 mt-2">01 <span class="text-sm font-medium text-gray-400 italic">SKU</span></h4>
                                <p class="text-[10px] text-red-500 mt-2 font-bold italic underline decoration-red-300">Segera Buat Pengadaan</p>
                            </div>
                            <i class="fa-solid fa-triangle-exclamation absolute -right-2 -bottom-2 text-red-50 text-7xl group-hover:scale-110 transition-transform"></i>
                        </div>
                        <div class="bg-white p-6 rounded-3xl border-l-8 border-yellow-400 shadow-sm relative overflow-hidden group transition hover:shadow-md">
                            <div class="relative z-10">
                                <p class="text-xs font-black text-yellow-500 uppercase tracking-widest text-[10px]">Peringatan (7 - 10)</p>
                                <h4 class="text-4xl font-black text-slate-800 mt-2">04 <span class="text-sm font-medium text-gray-400 italic">SKU</span></h4>
                                <p class="text-[10px] text-yellow-600 mt-2 font-bold italic">Pantau Pemakaian Rutin</p>
                            </div>
                            <i class="fa-solid fa-clock-rotate-left absolute -right-2 -bottom-2 text-yellow-50 text-7xl group-hover:scale-110 transition-transform"></i>
                        </div>
                        <div class="bg-white p-6 rounded-3xl border-l-8 border-green-500 shadow-sm relative overflow-hidden group transition hover:shadow-md">
                            <div class="relative z-10">
                                <p class="text-xs font-black text-green-500 uppercase tracking-widest text-[10px]">Stok Aman (> 10)</p>
                                <h4 class="text-4xl font-black text-slate-800 mt-2">12 <span class="text-sm font-medium text-gray-400 italic">SKU</span></h4>
                                <p class="text-[10px] text-green-600 mt-2 font-bold italic">Ketersediaan Terjamin</p>
                            </div>
                            <i class="fa-solid fa-circle-check absolute -right-2 -bottom-2 text-green-50 text-7xl group-hover:scale-110 transition-transform"></i>
                        </div>
                    </div>
                </div>

                <div x-show="role === 'Gudang'">
                    <div x-show="view === 'inbound'" class="bg-white p-12 rounded-3xl border shadow-sm text-center">
                        <i class="fa-solid fa-qrcode text-8xl text-slate-200 mb-6"></i>
                        <h3 class="text-2xl font-bold mb-4 italic text-slate-600 underline">SCAN BARCODE INBOUND</h3>
                        <p class="text-gray-500 mb-8 max-w-sm mx-auto">Gunakan kamera HP kantor untuk memindai barang masuk dari vendor guna menambah stok otomatis.</p>
                        <button class="px-8 py-4 bg-red-600 text-white rounded-full font-bold shadow-xl shadow-red-200 hover:scale-105 transition"><i class="fa-solid fa-camera mr-2"></i> AKTIFKAN KAMERA</button>
                    </div>

                    <div x-show="view === 'outbound'" class="bg-white p-12 rounded-3xl border shadow-sm text-center">
                        <i class="fa-solid fa-barcode text-8xl text-slate-200 mb-6"></i>
                        <h3 class="text-2xl font-bold mb-4 italic text-slate-600 underline">SCAN BARCODE OUTBOUND</h3>
                        <p class="text-gray-500 mb-8 max-w-sm mx-auto">Gunakan kamera HP kantor untuk memindai barang keluar guna mengurangi stok otomatis.</p>
                        <button class="px-8 py-4 bg-slate-800 text-white rounded-full font-bold shadow-xl hover:scale-105 transition"><i class="fa-solid fa-camera mr-2"></i> AKTIFKAN KAMERA</button>
                    </div>

                    <div x-show="view === 'inventory'" class="bg-white p-6 rounded-2xl border shadow-sm overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-900 text-white text-[10px] uppercase tracking-widest">
                                    <th class="p-4">Nama Barang</th>
                                    <th class="p-4 text-center">Unit</th>
                                    <th class="p-4 text-center">Stok</th>
                                    <th class="p-4">Status Label</th>
                                    <th class="p-4">Update Terakhir</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm">
                                <tr class="border-b hover:bg-gray-50 transition">
                                    <td class="p-4 font-bold text-slate-700">Kertas HVS A4</td>
                                    <td class="p-4 text-center text-gray-500">Rim</td>
                                    <td class="p-4 text-center font-mono font-bold text-lg text-green-600">245</td>
                                    <td class="p-4">
                                        <span class="bg-green-100 text-green-700 border border-green-200 px-3 py-1 rounded-full text-[10px] font-black uppercase">🟢 AMAN</span>
                                    </td>
                                    <td class="p-4 text-gray-400 italic">2 menit yang lalu</td>
                                </tr>
                                <tr class="border-b hover:bg-gray-50 transition">
                                    <td class="p-4 font-bold text-slate-700">Tinta Stempel Magenta</td>
                                    <td class="p-4 text-center text-gray-500">Botol</td>
                                    <td class="p-4 text-center font-mono font-bold text-lg text-yellow-600">8</td>
                                    <td class="p-4">
                                        <span class="bg-yellow-400 text-white px-3 py-1 rounded-full text-[10px] font-black">🟡 WARNING</span>
                                    </td>
                                    <td class="p-4 text-gray-400 italic">1 jam yang lalu</td>
                                </tr>
                                <tr class="bg-red-50/50 border-b border-red-100 hover:bg-red-50 transition">
                                    <td class="p-4 font-bold text-slate-700">Toner Printer HP 101</td>
                                    <td class="p-4 text-center text-gray-500">Pcs</td>
                                    <td class="p-4 text-center font-mono font-bold text-lg text-red-600 animate-pulse">2</td>
                                    <td class="p-4">
                                        <span class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] font-black shadow-lg shadow-red-200">🔴 KRITIS</span>
                                    </td>
                                    <td class="p-4 text-red-400 italic">Sekarang</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div x-show="view === 'rop-notif'" class="space-y-4">
                        <div class="bg-red-600 p-6 rounded-2xl text-white shadow-xl flex items-center justify-between border-4 border-red-200 animate-pulse">
                            <div><h4 class="text-xl font-bold uppercase tracking-tighter">PERINGATAN STOK MINIMAL!</h4><p class="text-red-100">Barang: Toner Printer HP 101 mencapai titik pengadaan ulang.</p></div>
                            <i class="fa-solid fa-bell text-4xl"></i>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border flex items-center justify-between shadow-sm">
                            <span class="font-bold text-slate-700 uppercase tracking-widest text-sm">Log Notifikasi ROP</span>
                            <button class="text-xs bg-slate-100 px-3 py-1 rounded">Bersihkan Log</button>
                        </div>
                    </div>
                </div>

                <div x-show="role === 'Procurement'">
                    <div x-show="view === 'rop'" class="space-y-6">
                        <div class="bg-white p-8 rounded-3xl border shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-6">List Pengadaan Otomatis (ROP Trigger)</h3>
                            <div class="bg-red-50 p-4 rounded-xl border-l-4 border-red-500 mb-4 flex justify-between items-center">
                                <div><p class="font-bold text-red-900">PR-2023-0091 <span class="bg-red-600 text-white text-[10px] px-2 py-1 rounded-full ml-2">KRITIS</span></p><p class="text-xs mt-1">Barang: Toner Printer | Status: Menunggu Quotation</p></div>
                                <button class="bg-red-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg shadow-red-100">OPEN BIDDING</button>
                            </div>
                        </div>
                    </div>

                    <div x-show="view === 'scoring'" class="bg-white p-8 rounded-3xl border shadow-sm overflow-hidden">
                        <table class="w-full text-sm">
                            <thead><tr class="bg-slate-800 text-white"><th class="p-4 text-left">Vendor</th><th class="p-4">TBE (Technical)</th><th class="p-4">CBE (Commercial)</th><th class="p-4">Skor Akhir</th></tr></thead>
                            <tbody>
                                <tr class="border-b"><td class="p-4 font-bold">PT. Solusi Digital</td><td class="p-4 text-center">85.00</td><td class="p-4 text-center">90.50</td><td class="p-4 text-center font-black text-red-600">87.75</td></tr>
                                <tr class="border-b"><td class="p-4 font-bold">CV. Global Tech</td><td class="p-4 text-center">92.00</td><td class="p-4 text-center">78.00</td><td class="p-4 text-center font-black text-slate-800">85.00</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div x-show="view === 'ranking'" class="space-y-6">
                        <div class="bg-slate-900 p-8 rounded-3xl text-white shadow-xl">
                            <h3 class="text-xl font-bold mb-6">Final Ranking & Kuota Order</h3>
                            <div class="space-y-4">
                                <div class="flex items-center justify-between p-4 bg-white/10 rounded-xl border border-white/20">
                                    <div class="flex items-center"><span class="w-8 h-8 bg-yellow-400 text-slate-900 rounded-full flex items-center justify-center font-black mr-4">1</span><span>PT. Solusi Digital (Main Vendor)</span></div>
                                    <input type="number" value="70" class="w-20 bg-white/5 border border-white/20 p-2 rounded text-center"> <span class="text-xs uppercase font-bold text-slate-400">KUOTA %</span>
                                </div>
                                <div class="flex items-center justify-between p-4 bg-white/10 rounded-xl border border-white/20">
                                    <div class="flex items-center"><span class="w-8 h-8 bg-slate-300 text-slate-900 rounded-full flex items-center justify-center font-black mr-4">2</span><span>CV. Global Tech (Secondary)</span></div>
                                    <input type="number" value="30" class="w-20 bg-white/5 border border-white/20 p-2 rounded text-center"> <span class="text-xs uppercase font-bold text-slate-400">KUOTA %</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div x-show="view === 'chat'" class="bg-white rounded-3xl border shadow-xl flex flex-col h-[500px]">
                        <div class="p-4 border-b bg-slate-50 font-bold">Diskusi Teknis: PO-2023-088</div>
                        <div class="flex-1 p-6 overflow-y-auto space-y-4 text-sm">
                            <div class="flex flex-col items-start"><span class="text-[10px] text-gray-400">Tim Procurement</span><div class="bg-slate-100 p-3 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm">Mohon klarifikasi mengenai garansi panel LCD?</div></div>
                            <div class="flex flex-col items-end"><span class="text-[10px] text-gray-400">Vendor (PT. Solusi Digital)</span><div class="bg-red-600 text-white p-3 rounded-2xl rounded-tr-none max-w-[80%] shadow-md">Garansi panel berlaku 3 tahun On-Site service Pak.</div></div>
                        </div>
                        <div class="p-4 border-t flex gap-2">
                            <input type="text" placeholder="Tulis klarifikasi penawaran..." class="flex-1 border p-3 rounded-xl outline-red-500">
                            <button class="bg-slate-900 text-white p-4 rounded-xl shadow-lg"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>

                    <div x-show="view === 'approval'" class="bg-white p-12 rounded-3xl border shadow-sm text-center">
                        <i class="fa-solid fa-stamp text-8xl text-slate-200 mb-6"></i>
                        <h3 class="text-2xl font-bold mb-4">APPROVAL MANAGER</h3>
                        <p class="text-gray-500 mb-8 max-w-sm mx-auto">Purchase Order (PO) yang sudah melalui scoring harus divalidasi oleh Manajer sebelum dikirim ke Vendor.</p>
                        <div class="flex justify-center gap-4">
                            <button class="px-8 py-3 bg-red-600 text-white rounded-xl font-bold shadow-lg shadow-red-100 hover:scale-105 transition italic">VALIDASI SEKARANG</button>
                        </div>
                    </div>
                </div>

                <div x-show="role === 'Finance'">
                    <div x-show="view === '3way'" class="bg-white p-10 rounded-3xl border shadow-sm">
                        <div class="grid grid-cols-3 gap-6 text-center">
                            <div class="p-6 border-2 border-green-500 bg-green-50 rounded-2xl"><i class="fa-solid fa-file-invoice text-green-600 text-2xl mb-2"></i><p class="text-xs font-black">DATA PO (OK)</p></div>
                            <div class="p-6 border-2 border-green-500 bg-green-50 rounded-2xl"><i class="fa-solid fa-truck-ramp-box text-green-600 text-2xl mb-2"></i><p class="text-xs font-black">SCAN GUDANG (OK)</p></div>
                            <div class="p-6 border-2 border-red-500 bg-red-50 rounded-2xl animate-pulse"><i class="fa-solid fa-file-circle-exclamation text-red-600 text-2xl mb-2"></i><p class="text-xs font-black italic">E-INVOICE (WAITING)</p></div>
                        </div>
                        <p class="mt-8 text-center text-gray-500 italic text-sm italic">Sistem membandingkan PO, Penerimaan Gudang, dan Faktur secara otomatis.</p>
                    </div>

                    <div x-show="view === 'settlement'" class="bg-white p-8 rounded-3xl border shadow-sm space-y-4">
                        <div class="flex items-center justify-between p-4 bg-slate-50 border rounded-xl group hover:border-red-500 cursor-pointer transition">
                            <div><p class="font-bold">PELUNASAN PO-9901</p><p class="text-xs text-gray-400">PT. Solusi Digital | Rp 45.000.000</p></div>
                            <button class="bg-slate-900 text-white px-4 py-2 rounded font-black text-[10px]">BAYAR DP 30%</button>
                        </div>
                        <div class="flex items-center justify-between p-4 bg-slate-50 border rounded-xl group hover:border-red-500 cursor-pointer transition">
                            <div><p class="font-bold">PELUNASAN FINAL PO-8812</p><p class="text-xs text-gray-400">CV. Global Tech | Rp 12.000.000</p></div>
                            <button class="bg-green-600 text-white px-4 py-2 rounded font-black text-[10px]">LUNASI SEKARANG</button>
                        </div>
                    </div>

                    <div x-show="view === 'upload-proof'" class="bg-white p-12 rounded-3xl border shadow-sm text-center">
                        <div class="max-w-md mx-auto p-12 border-4 border-dashed border-slate-200 rounded-3xl group hover:border-red-400 transition cursor-pointer">
                            <i class="fa-solid fa-cloud-arrow-up text-6xl text-slate-200 group-hover:text-red-400 transition mb-4"></i>
                            <h4 class="font-bold">Upload Bukti Transfer</h4>
                            <p class="text-xs text-slate-400 mt-2 italic">Format: PDF/JPG. Ukuran maks 2MB.</p>
                        </div>
                        <p class="mt-6 text-xs text-gray-500">Bukti yang diunggah akan muncul secara transparan di dashboard vendor.</p>
                    </div>
                </div>

                <div x-show="role === 'Vendor'">
                    <div x-show="view === 'bidding'" class="bg-white p-8 rounded-3xl border shadow-sm">

    <script>
        function veridexApp() {
            return {
                role: 'Guest', // Guest, Gudang, Procurement, Finance, Vendor, Public
                view: 'home',

                setRole(newRole, initialView) {
                    this.role = newRole;
                    this.view = initialView;
                }
            }
